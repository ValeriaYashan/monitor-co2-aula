<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de CO2 del aula</title>
<style>
  :root { --fondo:#ffffff; --texto:#2C2C2A; --suave:#5F5E5A; --linea:#D3D1C7; --tarjeta:#F1EFE8; --verde:#1D9E75; --amarillo:#BA7517; --rojo:#A32D2D; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo:#1f1f1e; --texto:#F1EFE8; --suave:#B4B2A9; --linea:#444441; --tarjeta:#2C2C2A; --verde:#5DCAA5; --amarillo:#EF9F27; --rojo:#F09595; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--fondo); color:var(--texto); line-height:1.5; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  h2 { font-size: 16px; font-weight: 500; margin: 24px 0 8px; }
  p { margin: 0 0 12px; color: var(--suave); }
  .barra { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin: 12px 0; }
  button, select, input { font: inherit; padding: 6px 10px; border:1px solid var(--linea); border-radius:8px; background:var(--tarjeta); color:var(--texto); }
  button { cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  input[type=number] { width: 84px; }
  input[type=text] { min-width: 220px; }
  .tarjeta { display:flex; flex-wrap:wrap; gap:24px; align-items:center; padding:16px; background:var(--tarjeta); border-radius:12px; }
  .semaforo { display:flex; gap:10px; }
  .luz { width:36px; height:36px; border-radius:50%; border:2px solid var(--linea); opacity:.35; }
  .luz.activa { opacity:1; }
  #luz-verde.activa { background:var(--verde); border-color:var(--verde); }
  #luz-amarillo.activa { background:var(--amarillo); border-color:var(--amarillo); }
  #luz-rojo.activa { background:var(--rojo); border-color:var(--rojo); }
  #estado-valor { font-size: 32px; font-weight: 500; }
  #estado-texto { font-size: 16px; color: var(--suave); }
  canvas { width:100%; height:340px; display:block; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--linea); }
  #mensaje { color: var(--suave); min-height: 1.5em; }
  .aviso { padding:8px 12px; border-radius:8px; background:var(--tarjeta); color:var(--amarillo); }
</style>
</head>
<body>
<main>
  <div class="barra" style="justify-content:space-between">
    <div>
      <h1 data-t="titulo">Monitor de CO2 del aula</h1>
      <p data-t="subtitulo"></p>
    </div>
    <select id="idioma" aria-label="Idioma / Language">
      <option value="es">Español</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="barra">
    <label><span data-t="cargar"></span> <input id="archivo" type="file" accept=".csv,text/csv"></label>
    <button id="btn-ejemplo" type="button" data-t="ejemplo"></button>
  </div>
  <div class="barra">
    <label><span data-t="url"></span> <input id="url" type="text" placeholder="http://192.168.1.50"></label>
    <button id="btn-conectar" type="button" data-t="conectar"></button>
    <button id="btn-detener" type="button" data-t="detener"></button>
  </div>
  <div class="barra">
    <span data-t="umbrales"></span>
    <label><span data-t="amarillo"></span> <input id="umbral-amarillo" type="number" value="800" min="400" max="5000" step="50"></label>
    <label><span data-t="rojo"></span> <input id="umbral-rojo" type="number" value="1000" min="400" max="5000" step="50"></label>
  </div>
  <div id="aviso-simulado" class="aviso" hidden data-t="simulado"></div>
  <div id="mensaje" role="status"></div>

  <h2 data-t="ultimo"></h2>
  <div class="tarjeta" aria-live="polite">
    <div class="semaforo" aria-hidden="true">
      <div class="luz" id="luz-verde"></div>
      <div class="luz" id="luz-amarillo"></div>
      <div class="luz" id="luz-rojo"></div>
    </div>
    <div>
      <div id="estado-valor">-</div>
      <div id="estado-texto"></div>
    </div>
  </div>

  <h2 data-t="grafico"></h2>
  <canvas id="canvas" role="img" aria-label="Evolución del CO2"></canvas>

  <h2 data-t="resumen"></h2>
  <table>
    <thead>
      <tr>
        <th data-t="aula"></th><th data-t="lecturas"></th><th data-t="promedio"></th><th data-t="maximo"></th>
        <th id="th-amarillo"></th><th id="th-rojo"></th>
      </tr>
    </thead>
    <tbody id="resumen-cuerpo"></tbody>
  </table>
</main>
<script src="app.js"></script>
</body>
</html>
