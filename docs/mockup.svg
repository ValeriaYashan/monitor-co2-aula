<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img">
<title>Mockup del monitor de CO2 del aula</title>
<desc>Caja impresa en 3D con semáforo de tres LEDs, un ESP32 y un sensor SCD40, que envía datos a un panel web con gráfico y umbrales.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="330" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif">
<text x="40" y="34" font-size="14" font-weight="500" fill="#2C2C2A">Dispositivo en el aula</text>
<text x="350" y="34" font-size="14" font-weight="500" fill="#2C2C2A">Panel web</text>
<rect x="40" y="50" width="250" height="220" rx="14" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<circle cx="115" cy="84" r="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<circle cx="165" cy="84" r="12" fill="#BA7517" stroke="#854F0B" stroke-width="1"/>
<circle cx="215" cy="84" r="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="165" y="122" font-size="12" fill="#5F5E5A" text-anchor="middle">Semáforo de CO2</text>
<rect x="60" y="140" width="120" height="86" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="120" y="176" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">ESP32</text>
<text x="120" y="196" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Wi-Fi + USB</text>
<rect x="200" y="140" width="64" height="86" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="232" y="176" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">SCD40</text>
<text x="232" y="196" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">CO2</text>
<line x1="180" y1="183" x2="200" y2="183" stroke="#444441" stroke-width="1.5"/>
<rect x="284" y="150" width="12" height="6" rx="2" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="284" y="164" width="12" height="6" rx="2" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="284" y="178" width="12" height="6" rx="2" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="284" y="192" width="12" height="6" rx="2" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="165" y="296" font-size="12" fill="#5F5E5A" text-anchor="middle">Caja 3D con ventilas frente al sensor</text>
<line x1="302" y1="160" x2="340" y2="160" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="350" y="50" width="290" height="220" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<circle cx="372" cy="76" r="9" fill="#BA7517"/>
<text x="392" y="74" font-size="16" font-weight="500" fill="#2C2C2A">888 ppm</text>
<text x="392" y="90" font-size="12" fill="#5F5E5A">Conviene ventilar</text>
<line x1="380" y1="108" x2="380" y2="246" stroke="#444441" stroke-width="0.5"/>
<line x1="380" y1="246" x2="620" y2="246" stroke="#444441" stroke-width="0.5"/>
<line x1="380" y1="150" x2="620" y2="150" stroke="#A32D2D" stroke-width="1" stroke-dasharray="5 3"/>
<line x1="380" y1="176" x2="620" y2="176" stroke="#BA7517" stroke-width="1" stroke-dasharray="5 3"/>
<text x="386" y="145" font-size="11" fill="#A32D2D">1000 ppm</text>
<text x="386" y="171" font-size="11" fill="#BA7517">800 ppm</text>
<polyline fill="none" stroke="#D85A30" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="380,236 410,196 440,160 470,134 500,120 520,116 535,214 560,190 590,150 620,128"/>
<polyline fill="none" stroke="#378ADD" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="380,236 410,210 440,190 470,182 500,180 520,179 535,230 560,200 590,184 620,180"/>
<text x="380" y="262" font-size="12" fill="#5F5E5A">07:30</text>
<text x="620" y="262" font-size="12" fill="#5F5E5A" text-anchor="end">13:00</text>
<line x1="350" y1="296" x2="370" y2="296" stroke="#D85A30" stroke-width="2" stroke-linecap="round"/>
<text x="376" y="300" font-size="12" fill="#5F5E5A">Aula cerrada</text>
<line x1="480" y1="296" x2="500" y2="296" stroke="#378ADD" stroke-width="2" stroke-linecap="round"/>
<text x="506" y="300" font-size="12" fill="#5F5E5A">Aula ventilada</text>
</g>
</svg>
